name: Export app screens to PDF
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-app-pdf.yml'
      - 'tools/export_app_pdf.py'
      - 'tools/export_teacher_pdf.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow reportlab
          python -m playwright install --with-deps chromium
      - name: Generate PDF of teacher dashboard
        run: python tools/export_teacher_pdf.py
      - name: Generate PDF of every in-game screen
        run: python tools/export_app_pdf.py
      - name: Publish downloadable PDFs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/*.pdf
          git restore --staged -- 'downloads/*.tmp.pdf' 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Publish PDF export of all Egypt Exit Game screens"
            git pull --rebase origin main
            git push
          fi
